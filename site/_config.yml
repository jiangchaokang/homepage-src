url: "https://jiangchaokang.github.io"
baseurl: ""
lang: "en"
timezone: "Asia/Shanghai"

author:
  name: "Jiang Chaokang"
  name_cn: "蒋超康"
  role: "World Models Algorithm Engineer"
  company: "Bosch (XC-CN)"
  location: "Beijing, China"
  email: "jck98@foxmail.com"
  github: "https://github.com/jiangchaokang"
  scholar: "https://scholar.google.com/citations?user=6gZ8vloAAAAJ&hl=en"
  x: "https://x.com/chaokangjiang1"
  openreview: "https://openreview.net/profile?id=~Chaokang_Jiang1"
  wechat: "Jck_98"
  avatar: "/assets/img/chaokang_jiang/avatar.png"
  logo: "/assets/img/chaokang_jiang/logo-mark.svg"
  favicon: "/assets/img/chaokang_jiang/favicon-dark.png"

nav:
  - title: "Home"
    url: "/"
  - title: "Publications"
    url: "/publications/"
    menu: "publications"
    blurb: "Peer-reviewed work on world models, generative driving, and 3D/4D perception."
  - title: "Projects"
    url: "/projects/"
    menu: "projects"
    blurb: "Production systems and research platforms, shown as interactive logic maps."
  - title: "Blog"
    url: "/blog/"
    menu: "blog"
    blurb: "Engineering notes and long-term practice."
  - title: "Contact"
    url: "/contact/"
    menu: "contact"
    blurb: "Collaboration, talks, and academic service."

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
      hide_news: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      hide_news: true

permalink: /blog/:year/:month/:day/:title/
future: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gem"
  - "*.tgz"
  - tools
  - AGENTS.md
  - DESIGN.md
  - TALK_POST_GUIDE.md
  - assets/media/blog/script
  - assets/media/projects/perception_onemodel/build_chart.py
  - log.txt
