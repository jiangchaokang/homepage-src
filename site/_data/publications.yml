- id: "jiang2026vectorworld"
  selected: true
  title: "VectorWorld: Efficient Streaming World Model via Diffusion Flow on Vector Graphs"
  authors: "Chaokang Jiang, Desen Zhou, Jiuming Liu, Kevin Li Sun"
  venue: "ICML Spotlight / arXiv preprint arXiv:2603.17652"
  venue_short: "ICML"
  year: 2026
  status: "Accepted · Spotlight"
  media: "/assets/media/papers/VectorWorld.gif"
  tags: ["world-model", "generative", "e2e"]
  institutions: ["Bosch China", "Research Collaboration"]
  summary: "Rolling a driving world model forward on dense BEV rasters is expensive, which is what keeps world models out of streaming use."
  contribution: "It runs the diffusion flow over a compact vector graph of agents and lanes instead of a dense raster, so rollout cost scales with the number of scene elements rather than with resolution — cheap enough to generate the future as a stream."
