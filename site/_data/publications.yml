- id: "liu2026regformerpp"
  selected: true
  title: "RegFormer++: An Efficient Large-Scale 3D LiDAR Point Registration Network with Projection-Aware 2D Transformer"
  authors: "Jiuming Liu, Guangming Wang, Zhe Liu, Chaokang Jiang, Haoang Li, Mengmeng Liu, Tianchen Deng, Marc Pollefeys, Michael Ying Yang, Hesheng Wang"
  venue: "arXiv preprint arXiv:2603.14290"
  venue_short: "arXiv"
  year: 2026
  status: "Preprint"
  media: "/assets/media/papers/paper_06_regformer.gif"
  tags: ["lidar-odometry", "perception"]
  institutions: ["Research Collaboration"]
  summary: "Large-scale LiDAR registration is dominated by the cost of attention over hundreds of thousands of unordered points."
  contribution: "It keeps the registration in 3D but moves the attention onto a range projection, so a 2D transformer carries the heavy computation while the point geometry stays exact — no voxel downsampling, no hand-built descriptors."
