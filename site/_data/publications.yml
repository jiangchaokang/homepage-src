  media: "/assets/media/papers/paper_02_difflow3d.gif"
  tags: ["scene-flow", "generative", "perception"]
  institutions: ["SJTU IRMV", "Research Collaboration"]
  summary: "Single-shot scene-flow regression collapses on large or ambiguous motion, and gives no signal about which predictions are unreliable."
  contribution: "It casts flow refinement as an iterative diffusion conditioned on the previous estimate, which recovers the motions regression averages away and yields a per-point reliability estimate as a by-product."
